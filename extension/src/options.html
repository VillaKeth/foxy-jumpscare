<!doctype html>
<meta charset="utf-8">
<title>Foxy Jumpscare</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 34rem; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin: 1.2rem 0; }
  select { font: inherit; padding: 0.25rem; margin-top: 0.3rem; }
  .status { color: #060; min-height: 1.5em; }
  .warn { color: #a00; border-left: 3px solid #a00; padding-left: 0.75rem; }
  .note { color: #555; font-size: 0.9em; }
</style>

<h1>Foxy Jumpscare</h1>

<label>
  <input type="checkbox" id="enabled"> Enabled
</label>

<label>
  Rarity
  <select id="odds">
    <option value="ultra-rare">Ultra-rare &mdash; about once every 10 weeks</option>
    <option value="rare">Rare &mdash; about once every 3 weeks</option>
    <option value="normal">Normal &mdash; about once a week</option>
    <option value="terraria-faithful">Terraria-faithful &mdash; about once a day</option>
  </select>
</label>

<p class="note">
  Odds are rolled once per second of active browsing &mdash; not per page, and not
  while the browser is in the background.
</p>

<p class="status" id="status"></p>

<p class="warn">
  Sudden loud video and audio by design. Not suitable if you are photosensitive.
</p>

<script src="options.js" type="module"></script>
