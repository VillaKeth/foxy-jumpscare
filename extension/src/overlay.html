<!doctype html>
<meta charset="utf-8">
<title>foxy</title>
<!--
  Must stay HERE: above the stylesheet, no defer, no type="module". It picks
  the backdrop before first paint, which is the difference between the
  standalone fallback opening black and opening with a white flash. An inline
  script would be blocked by MV3's script-src 'self'. See backdrop.js.
-->
<script src="backdrop.js"></script>
<style>
  /*
   * Transparent, and it has to stay that way: the whole effect is Foxy keyed
   * out of the greenscreen and lunging over whatever you were actually
   * reading. An opaque backdrop turns that into a video player.
   *
   * This is the right value for the iframe case only. When the page loads in
   * a window of its own - the fallback in fire.mjs - transparent resolves to
   * the browser's blank canvas and the scare is a fullscreen white flash.
   * overlay.js detects that case and paints it black; see the note there.
   * Do not resolve the two cases by changing this line.
   */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
<video id="foxy" src="foxy.webm" autoplay playsinline></video>
<script src="overlay.js" type="module"></script>
