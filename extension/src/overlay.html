<!doctype html>
<meta charset="utf-8">
<title>foxy</title>
<style>
  /*
   * Transparent, and it has to stay that way: the whole effect is Foxy keyed
   * out of the greenscreen and lunging over whatever you were actually
   * reading. An opaque backdrop turns that into a video player.
   *
   * 0.1.3 shipped this as #000 to match the desktop app's fullscreen black
   * window, on the theory that landing on a white page read as a flashbang.
   * It does flash - but the flash is the page, not the overlay, and blacking
   * it out threw away the point of keying the video in the first place.
   * Reverted in 0.1.4. Do not "fix" the flash here; there is nothing to fix.
   */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
<video id="foxy" src="foxy.webm" autoplay playsinline></video>
<script src="overlay.js" type="module"></script>
